<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3b68">
<title>Masuk — MTA Jebres 2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M18 33l10 10 18-20' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<div class="login-shell">
  <div class="login-brand">
    <div>
      <span class="brand-mark"><img class="brand-logo" src="/assets/logo_mta.png" alt="Logo MTA Jebres 2"></span>
      <h2>Sistem Presensi MTA Jebres 2</h2>
    </div>
  </div>

  <div class="login-form-wrap">
    <h1>Selamat datang</h1>
    <p class="sub">Masuk untuk mengelola data presensi.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Kata sandi</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Masukkan kata sandi" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Tampilkan kata sandi" aria-pressed="false">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="loginButton">Masuk</button>
      <div id="loginError" class="login-error" role="alert"></div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const toggleBtn = document.getElementById('togglePassword')
const passwordInput = document.getElementById('password')
toggleBtn.addEventListener('click', () => {
  const show = passwordInput.type === 'password'
  passwordInput.type = show ? 'text' : 'password'
  toggleBtn.setAttribute('aria-pressed', String(show))
  toggleBtn.querySelector('.ic').innerHTML = show
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>'
    : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>'
})

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault()
  const username = document.getElementById('username').value.trim()
  const password = document.getElementById('password').value
  const errorEl = document.getElementById('loginError')
  const button = document.getElementById('loginButton')
  errorEl.classList.remove('show')

  if (!username || !password) {
    errorEl.textContent = 'Username dan kata sandi wajib diisi.'
    errorEl.classList.add('show')
    return
  }

  button.classList.add('is-loading')
  button.innerHTML = '<span class="spinner"></span> Memeriksa...'
  button.disabled = true

  try {
    const result = await API.login(username, password)
    localStorage.setItem('token', result.token)
    window.location.href = 'dashboard.html'
  } catch (err) {
    errorEl.textContent = err.message || 'Login gagal'
    errorEl.classList.add('show')
    button.classList.remove('is-loading')
    button.innerHTML = 'Masuk'
    button.disabled = false
  }
})
</script>
</body>
</html>
