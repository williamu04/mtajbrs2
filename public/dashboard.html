<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Dashboard — MTA Jebres 2 Presensi</title>
<link rel="icon" type="image/png" href="/assets/logo_mta.png">
<link rel="apple-touch-icon" href="/assets/logo_mta.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="dashboard">
<header class="app-header">
  <div class="container app-header-inner">
    <a class="brand" href="dashboard.html">
      <span class="brand-mark"><img class="brand-logo" src="/assets/logo_mta.png" alt="Logo MTA Jebres 2" width="34" height="34"></span>
      <span class="brand-name">MTA Jebres 2</span>
    </a>

    <!-- Desktop nav bar -->
    <nav class="desktop-nav" aria-label="Navigasi utama">
      <button type="button" class="nav-btn active" data-tab="batches">Gelombang</button>
      <button type="button" class="nav-btn" data-tab="groups">Kelompok</button>
      <button type="button" class="nav-btn" data-tab="members">Anggota</button>
      <button type="button" class="nav-btn" data-tab="events">Kegiatan</button>
      <button type="button" class="nav-btn" data-tab="stats">Statistik</button>
      <span class="nav-divider"></span>
      <button type="button" class="nav-btn logout" data-logout>Keluar</button>
    </nav>

    <!-- Mobile header direct action: Logout -->
    <div class="mobile-header-actions">
      <button type="button" class="btn btn-xs btn-ghost-danger mobile-logout-btn" data-logout aria-label="Keluar">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Keluar</span>
      </button>
    </div>
  </div>
</header>

<!-- Mobile horizontal tab track directly under header -->
<div class="mobile-subnav" aria-label="Tab navigasi cepat">
  <div class="mobile-subnav-track">
    <button type="button" class="subnav-pill active" data-tab="batches">Gelombang</button>
    <button type="button" class="subnav-pill" data-tab="groups">Kelompok</button>
    <button type="button" class="subnav-pill" data-tab="members">Anggota</button>
    <button type="button" class="subnav-pill" data-tab="events">Kegiatan</button>
    <button type="button" class="subnav-pill" data-tab="stats">Statistik</button>
  </div>
</div>

<main class="container">
  <div id="tab-batches" class="tab-content"></div>
  <div id="tab-groups" class="tab-content" style="display:none"></div>
  <div id="tab-members" class="tab-content" style="display:none"></div>
  <div id="tab-events" class="tab-content" style="display:none"></div>
  <div id="tab-stats" class="tab-content" style="display:none"></div>
</main>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
